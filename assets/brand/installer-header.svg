<svg xmlns="http://www.w3.org/2000/svg" width="150" height="57" viewBox="0 0 150 57">
  <rect width="150" height="57" fill="#FFFFFF"/>
  <svg x="104" y="9" width="39" height="39" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262A36"/><stop offset="1" stop-color="#12141A"/></linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB15C"/><stop offset="1" stop-color="#FF6A00"/></linearGradient>
    <linearGradient id="wh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9CDD8"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>
  <!-- piliers : deux colonnes de touches -->
  <rect x="120" y="112" width="84" height="84" rx="22" fill="url(#wh)"/>
  <rect x="120" y="316" width="84" height="84" rx="22" fill="url(#wh)"/>
  <rect x="308" y="112" width="84" height="84" rx="22" fill="url(#wh)"/>
  <rect x="308" y="316" width="84" height="84" rx="22" fill="url(#wh)"/>
  <!-- barre centrale : le fader « forgé » -->
  <rect x="120" y="226" width="272" height="60" rx="30" fill="#FF7A1A" filter="url(#glow)" opacity="0.65"/>
  <rect x="120" y="226" width="272" height="60" rx="30" fill="url(#or)"/>
</svg>
  <text x="96" y="34" text-anchor="end" font-family="Inter" font-weight="600" font-size="15" fill="#1B1E26">Hub<tspan fill="#FF7A1A">Forge</tspan></text>
</svg>