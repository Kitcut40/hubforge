# ---------------------------------------------------------------------
#  Pages prêtes à l'emploi (bouton « Ajouter les pages » dans HubForge)
# ---------------------------------------------------------------------
[[page]]
id   = "main"
name = "Fusion 360"
keys = [
  { key = 1,  action = "create_sketch" },
  { key = 2,  action = "extrude" },
  { key = 3,  action = "revolve" },
  { key = 4,  action = "presspull" },
  { key = 5,  action = "hole" },
  { key = 6,  action = "fillet" },
  { key = 7,  action = "chamfer" },
  { key = 8,  action = "mirror" },
  { key = 9,  action = "move" },
  { key = 10, action = "measure" },
  { key = 11, action = "undo" },
  { key = 12, action = "redo" },
  { key = 13, action = "save" },
  { key = 14, action = "toolbox" },
  { key = 15, open = "sketch", label = "Esquisse…" },
]

[[page]]
id     = "sketch"
name   = "Fusion — Esquisse"
folder = true
keys = [
  { key = 1,  back = true },
  { key = 2,  action = "line" },
  { key = 3,  action = "rectangle" },
  { key = 4,  action = "circle" },
  { key = 5,  action = "circle_2p" },
  { key = 6,  action = "circle_3p" },
  { key = 7,  action = "arc_3p" },
  { key = 8,  action = "trim" },
  { key = 9,  action = "offset" },
  { key = 10, action = "project" },
  { key = 11, action = "dimension" },
  { key = 12, action = "construction" },
  { key = 13, action = "undo" },
  { key = 14, action = "toolbox" },
  { key = 15, action = "finish_sketch" },
]
