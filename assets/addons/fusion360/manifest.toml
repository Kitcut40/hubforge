# =====================================================================
#  Addon officiel HubForge — Fusion 360
#  Licence GPL-3.0-or-later. Icônes dessinées pour HubForge (aucun
#  logo ni élément d'Autodesk). Fusion 360 est une marque d'Autodesk.
#
#  Les outils sans raccourci par défaut passent par la recherche de
#  commandes de Fusion (touche S) : la macro tape le nom de l'outil puis
#  Entrée. Ces noms sont ceux de Fusion en français : si ton Fusion est
#  en anglais, remplace-les (ex. "Chamfer", "Mirror", "Revolve").
# =====================================================================

[addon]
id          = "fusion360"
name        = "Fusion 360"
version     = "1.0.0"
author      = "HubForge"
license     = "GPL-3.0-or-later"
description = "Esquisse, modélisation et modification : les outils de base de Fusion 360 sur le MasterHUB."
icon        = "icons/fusion.svg"
format      = 1

[detect]
windows = ["Fusion360.exe"]

[[category]]
id = "sketch"
name = "Esquisse"

[[category]]
id = "model"
name = "Créer"

[[category]]
id = "modify"
name = "Modifier"

[[category]]
id = "tools"
name = "Outils"

[[action]]
id          = "create_sketch"
name        = "Créer une esquisse"
label       = "Esquisse"
category    = "sketch"
icon        = "icons/sketch.svg"
color       = "#1565C0"
description = "Ouvre l'outil Créer une esquisse (via la recherche S)."
type        = "macro"
steps       = [ { type = "hotkey", keys = "s" }, { type = "wait", ms = 350 }, { type = "text", text = "Créer une esquisse" }, { type = "wait", ms = 600 }, { type = "hotkey", keys = "enter" } ]

[[action]]
id          = "finish_sketch"
name        = "Terminer l'esquisse"
label       = "Terminer"
category    = "sketch"
icon        = "icons/finish-sketch.svg"
color       = "#2E7D32"
description = "Quitte le mode esquisse (via la recherche S)."
type        = "macro"
steps       = [ { type = "hotkey", keys = "s" }, { type = "wait", ms = 350 }, { type = "text", text = "Terminer l'esquisse" }, { type = "wait", ms = 600 }, { type = "hotkey", keys = "enter" } ]

[[action]]
id          = "line"
name        = "Ligne"
label       = "Ligne"
category    = "sketch"
icon        = "icons/line.svg"
color       = "#1E88E5"
description = "Raccourci par défaut : L"
type        = "hotkey"
keys        = "l"

[[action]]
id          = "rectangle"
name        = "Rectangle 2 points"
label       = "Rectangle"
category    = "sketch"
icon        = "icons/rectangle.svg"
color       = "#1E88E5"
description = "Raccourci par défaut : R"
type        = "hotkey"
keys        = "r"

[[action]]
id          = "circle"
name        = "Cercle (centre, diamètre)"
label       = "Cercle"
category    = "sketch"
icon        = "icons/circle-center.svg"
color       = "#1E88E5"
description = "Raccourci par défaut : C"
type        = "hotkey"
keys        = "c"

[[action]]
id          = "circle_2p"
name        = "Cercle 2 points"
label       = "Cercle 2 pts"
category    = "sketch"
icon        = "icons/circle-2p.svg"
color       = "#1E88E5"
description = "Via la recherche S."
type        = "macro"
steps       = [ { type = "hotkey", keys = "s" }, { type = "wait", ms = 350 }, { type = "text", text = "Cercle 2 points" }, { type = "wait", ms = 600 }, { type = "hotkey", keys = "enter" } ]

