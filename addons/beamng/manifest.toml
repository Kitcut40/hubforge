[[page]]
id   = "main"
name = "BeamNG.drive"
keys = [
  { key = 1 , action = "ignition" },
  { key = 2 , action = "headlights" },
  { key = 3 , action = "signal_left" },
  { key = 4 , action = "hazards" },
  { key = 5 , action = "signal_right" },
  { key = 6 , action = "parking_brake" },
  { key = 7 , action = "horn" },
  { key = 8 , action = "shift_down" },
  { key = 9 , action = "shift_up" },
  { key = 10, action = "gearbox_mode" },
  { key = 11, action = "recover" },
  { key = 12, action = "reset" },
  { key = 13, action = "camera_next" },
  { key = 14, action = "map" },
  { key = 15, open = "more", label = "Plus…" },
]

[[page]]
id   = "more"
name = "BeamNG.drive — Plus"
folder      = true
close_after = false
keys = [
  { key = 1 , back = true },
  { key = 2 , action = "nitrous" },
  { key = 3 , action = "esc_mode" },
  { key = 4 , action = "awd" },
  { key = 5 , action = "lightbar" },
  { key = 6 , action = "pause" },
  { key = 7 , action = "slowmo" },
  { key = 8 , action = "photo_mode" },
  { key = 9 , action = "screenshot" },
  { key = 10, action = "hide_ui" },
  { key = 11, action = "camera_free" },
  { key = 12, action = "drop_player" },
  { key = 13, action = "vehicle_selector" },
  { key = 14, action = "traffic" },
  { key = 15, action = "walk" },
]
