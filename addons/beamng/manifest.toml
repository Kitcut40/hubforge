#  touche correspondante dans HubForge.
# =====================================================================

[addon]
id          = "beamng"
name        = "BeamNG.drive"
version     = "1.0.0"
author      = "Benjamin & Claude"
license     = "MIT"
description = "Contact, rapports, feux, clignotants, réparation, caméras, ralenti, mode photo et plus."
icon        = "auto"
format      = 1

[detect]
windows = ["BeamNG.drive.x64.exe", "BeamNG.drive.exe"]

[[category]]
id   = "drive"
name = "Conduite"

[[category]]
id   = "lights"
name = "Feux"

[[category]]
id   = "repair"
name = "Réparer et véhicules"

[[category]]
id   = "camera"
name = "Caméras"

[[category]]
id   = "game"
name = "Jeu"

[[action]]
id          = "ignition"
name        = "Contact / démarrer"
label       = "Contact"
category    = "drive"
icon        = "icons/key-round.svg"
color       = "#2E7D32"
text_color  = "#FFFFFF"
description = "Contact, puis démarrage du moteur (V)"
type        = "hotkey"
keys        = "v"

[[action]]
id          = "shift_up"
name        = "Rapport supérieur"
label       = "Rapport +"
category    = "drive"
icon        = "icons/chevrons-up.svg"
color       = "#37474F"
text_color  = "#FFFFFF"
description = "Monter un rapport (X)"
type        = "hotkey"
keys        = "x"

[[action]]
id          = "shift_down"
name        = "Rapport inférieur"
label       = "Rapport −"
category    = "drive"
icon        = "icons/chevrons-down.svg"
color       = "#37474F"
text_color  = "#FFFFFF"
description = "Descendre un rapport (Z)"
type        = "hotkey"
keys        = "z"

[[action]]
id          = "gearbox_mode"
name        = "Mode de boîte"
label       = "Mode boîte"
category    = "drive"
icon        = "icons/cog.svg"
color       = "#455A64"
text_color  = "#FFFFFF"
description = "Automatique, manuelle… (Q)"
type        = "hotkey"
keys        = "q"

[[action]]
id          = "parking_brake"
name        = "Frein à main (bascule)"
label       = "Frein à main"
category    = "drive"
icon        = "icons/circle-parking.svg"
color       = "#C62828"
text_color  = "#FFFFFF"
description = "Serre ou desserre le frein à main (P)"
type        = "hotkey"
keys        = "p"

[[action]]
id          = "horn"
name        = "Klaxon"
label       = "Klaxon"
category    = "drive"
icon        = "icons/megaphone.svg"
color       = "#F9A825"
text_color  = "#FFFFFF"
description = "Coup de klaxon (H)"
type        = "hotkey"
keys        = "h"

[[action]]
id          = "nitrous"
name        = "Nitro"
label       = "Nitro"
category    = "drive"
icon        = "icons/flame.svg"
color       = "#E65100"
text_color  = "#FFFFFF"
description = "Active ou coupe l'injection de protoxyde d'azote (B)"
type        = "hotkey"
keys        = "b"

[[action]]
id          = "esc_mode"
name        = "Mode ESC / antipatinage"
