# --- Pages prêtes à l'emploi --------------------------------------------
# Touches numérotées de 1 (en haut à gauche) à 15 (en bas à droite).

[[page]]
id = "main"
name = "Imprimante"
keys = [
  { key = 1,  action = "thumb" },                 # 1, 2, 6, 7
  { key = 3,  action = "nozzle" },
  { key = 4,  action = "bed" },
  { key = 5,  action = "menu", open = "control" },
  { key = 8,  action = "remaining" },
  { key = 9,  action = "eta" },
  { key = 10, action = "pause" },
  { key = 11, action = "pct" },
  { key = 12, action = "bar" },                   # 12 à 15
]

[[page]]
id = "control"
name = "Imprimante — Menu"
folder = true
keys = [
  { key = 1,  action = "back", back = true },
  { key = 2,  action = "pause" },
  { key = 3,  action = "stop" },
  { key = 4,  action = "reprint" },
  { key = 5,  action = "web" },
  { key = 6,  action = "heatmenu", open = "heat" },
  { key = 7,  action = "cooldown" },
  { key = 8,  action = "refresh" },
  { key = 9,  action = "nozzle" },
  { key = 10, action = "bed" },
  { key = 11, action = "pct" },
  { key = 12, action = "bar" },
]

[[page]]
id = "heat"
name = "Imprimante — Préchauffage"
folder = true
keys = [
  { key = 1,  action = "heat_pla" },
  { key = 2,  action = "heat_petg" },
  { key = 3,  action = "heat_asa" },
  { key = 4,  action = "heat_pc" },
  { key = 5,  action = "heat_pvb" },
  { key = 6,  action = "heat_abs" },
  { key = 7,  action = "heat_hips" },
  { key = 8,  action = "heat_pp" },
  { key = 9,  action = "heat_flex" },
  { key = 10, action = "heat_pa" },
  { key = 11, action = "back", back = true },
  { key = 12, action = "heat_custom" },
  { key = 13, action = "nozzle" },
  { key = 14, action = "bed" },
  { key = 15, action = "cooldown" },
]
