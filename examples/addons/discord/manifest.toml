# =====================================================================
#  Addon d'exemple HubForge — Discord
#  Licence MIT (les addons choisissent leur licence, voir ADDON-EXCEPTION.md).
#  Icônes dessinées pour HubForge : aucun logo de Discord (marque déposée).
#
#  Raccourcis par défaut de Discord pour Windows. Micro et sourdine
#  (Ctrl+Maj+M / Ctrl+Maj+D) sont pensés pour marcher même quand Discord
#  n'est pas au premier plan ; les autres actions agissent dans la
#  fenêtre de Discord (sa page s'affiche toute seule quand Discord est
#  au premier plan).
# =====================================================================

[addon]
id          = "discord"
name        = "Discord"
version     = "1.0.0"
author      = "Benjamin & Claude"
license     = "MIT"
description = "Vocal, navigation entre serveurs et salons, emojis, GIF et messages rapides."
icon        = "icons/addon.svg"
format      = 1

[detect]
windows = ["Discord.exe", "DiscordPTB.exe", "DiscordCanary.exe"]

[[category]]
id   = "voice"
name = "Vocal et appels"

[[category]]
id   = "nav"
name = "Navigation"

[[category]]
id     = "nav_servers"
name   = "Serveurs"
parent = "nav"

[[category]]
id     = "nav_channels"
name   = "Salons"
parent = "nav"

[[category]]
id   = "chat"
name = "Messages"

[[category]]
id     = "quick"
name   = "Messages rapides"
parent = "chat"

# --- Vocal et appels ---------------------------------------------------

[[action]]
id          = "mute"
name        = "Couper / rétablir le micro"
label       = "Micro"
category    = "voice"
icon        = "builtin:mic-off"
color       = "#ED4245"
description = "Ctrl+Maj+M"
type        = "hotkey"
keys        = "ctrl+shift+m"

[[action]]
id          = "deafen"
name        = "Mettre en sourdine"
label       = "Sourdine"
category    = "voice"
icon        = "icons/deafen.svg"
color       = "#ED4245"
description = "Ctrl+Maj+D : coupe le son et le micro"
type        = "hotkey"
keys        = "ctrl+shift+d"

[[action]]
id          = "answer"
name        = "Décrocher"
label       = "Décrocher"
category    = "voice"
icon        = "builtin:phone"
color       = "#3BA55D"
description = "Ctrl+Entrée (appel entrant)"
type        = "hotkey"
keys        = "ctrl+enter"

[[action]]
id          = "decline"
name        = "Refuser l'appel"
label       = "Refuser"
category    = "voice"
icon        = "icons/phone-off.svg"
color       = "#ED4245"
description = "Échap (appel entrant)"
type        = "hotkey"
keys        = "esc"

# --- Navigation --------------------------------------------------------

[[action]]
id          = "quick_switcher"
name        = "Recherche rapide"
label       = "Aller à…"
category    = "nav"
icon        = "icons/quick.svg"
color       = "#5865F2"
description = "Ctrl+K : serveur, salon ou message privé"
type        = "hotkey"
keys        = "ctrl+k"

[[action]]
id          = "server_prev"
name        = "Serveur précédent"
label       = "Serveur ↑"
category    = "nav_servers"
icon        = "icons/server-up.svg"
color       = "#4752C4"
description = "Ctrl+Alt+Haut"
type        = "hotkey"
keys        = "ctrl+alt+up"

[[action]]
id          = "server_next"
name        = "Serveur suivant"
label       = "Serveur ↓"
category    = "nav_servers"
icon        = "icons/server-down.svg"
color       = "#4752C4"
description = "Ctrl+Alt+Bas"
type        = "hotkey"
keys        = "ctrl+alt+down"

[[action]]
id          = "server_read"
name        = "Marquer le serveur comme lu"
label       = "Serveur lu"
category    = "nav_servers"
icon        = "icons/read.svg"
color       = "#4F545C"
description = "Maj+Échap"
type        = "hotkey"
keys        = "shift+esc"

[[action]]
id          = "channel_prev"
name        = "Salon précédent"
label       = "Salon ↑"
category    = "nav_channels"
icon        = "icons/channel-up.svg"
color       = "#3C45A5"
description = "Alt+Haut"
type        = "hotkey"
keys        = "alt+up"

[[action]]
id          = "channel_next"
name        = "Salon suivant"
label       = "Salon ↓"
category    = "nav_channels"
icon        = "icons/channel-down.svg"
color       = "#3C45A5"
description = "Alt+Bas"
type        = "hotkey"
keys        = "alt+down"

[[action]]
id          = "unread_next"
name        = "Salon non lu suivant"
label       = "Non lu"
category    = "nav_channels"
icon        = "icons/unread.svg"
color       = "#3C45A5"
description = "Alt+Maj+Bas"
type        = "hotkey"
keys        = "alt+shift+down"

[[action]]
id          = "channel_read"
name        = "Marquer le salon comme lu"
label       = "Salon lu"
category    = "nav_channels"
icon        = "icons/read.svg"
color       = "#4F545C"
description = "Échap"
type        = "hotkey"
keys        = "esc"

[[action]]
id          = "mentions"
name        = "Mentions"
label       = "Mentions"
category    = "nav"
icon        = "icons/mention.svg"
color       = "#5865F2"
description = "Ctrl+I"
type        = "hotkey"
keys        = "ctrl+i"

[[action]]
id          = "members"
name        = "Liste des membres"
label       = "Membres"
category    = "nav"
icon        = "builtin:users"
color       = "#4F545C"
description = "Ctrl+U"
type        = "hotkey"
keys        = "ctrl+u"

[[action]]
id          = "search"
name        = "Rechercher dans le salon"
label       = "Chercher"
category    = "nav"
icon        = "builtin:search"
color       = "#4F545C"
description = "Ctrl+F"
type        = "hotkey"
keys        = "ctrl+f"

# --- Messages ----------------------------------------------------------

[[action]]
id          = "emoji"
name        = "Emojis"
label       = "Emojis"
category    = "chat"
icon        = "icons/emoji.svg"
color       = "#FAA61A"
description = "Ctrl+E"
type        = "hotkey"
keys        = "ctrl+e"

[[action]]
id          = "gif"
name        = "GIF"
label       = "GIF"
category    = "chat"
icon        = "icons/gif.svg"
color       = "#FAA61A"
description = "Ctrl+G"
type        = "hotkey"
keys        = "ctrl+g"

[[action]]
id          = "upload"
name        = "Envoyer un fichier"
label       = "Fichier"
category    = "chat"
icon        = "builtin:upload"
color       = "#3BA55D"
description = "Ctrl+Maj+U"
type        = "hotkey"
keys        = "ctrl+shift+u"

[[action]]
id          = "pins"
name        = "Messages épinglés"
label       = "Épinglés"
category    = "chat"
icon        = "icons/pin.svg"
color       = "#4F545C"
description = "Ctrl+P"
type        = "hotkey"
keys        = "ctrl+p"

[[action]]
id          = "msg_gg"
name        = "Écrire « GG ! »"
label       = "GG !"
category    = "quick"
icon        = "builtin:star"
color       = "#EB459E"
description = "Tape le message puis Entrée"
type        = "macro"
steps       = [ { type = "text", text = "GG ! 🎉" }, { type = "wait", ms = 80 }, { type = "hotkey", keys = "enter" } ]

[[action]]
id          = "msg_coming"
name        = "Écrire « J'arrive »"
label       = "J'arrive"
category    = "quick"
icon        = "builtin:rocket"
color       = "#EB459E"
description = "Tape le message puis Entrée"
type        = "macro"
steps       = [ { type = "text", text = "J'arrive !" }, { type = "wait", ms = 80 }, { type = "hotkey", keys = "enter" } ]

[[action]]
id          = "msg_afk"
name        = "Écrire « AFK 5 min »"
label       = "AFK 5 min"
category    = "quick"
icon        = "builtin:coffee"
color       = "#EB459E"
description = "Tape le message puis Entrée"
type        = "macro"
steps       = [ { type = "text", text = "AFK 5 min ☕" }, { type = "wait", ms = 80 }, { type = "hotkey", keys = "enter" } ]

[[action]]
id          = "msg_thanks"
name        = "Écrire « Merci ! »"
label       = "Merci"
category    = "quick"
icon        = "builtin:heart"
color       = "#EB459E"
description = "Tape le message puis Entrée"
type        = "macro"
steps       = [ { type = "text", text = "Merci ! 🙏" }, { type = "wait", ms = 80 }, { type = "hotkey", keys = "enter" } ]

[[action]]
id          = "msg_night"
name        = "Écrire « Bonne nuit »"
label       = "Bonne nuit"
category    = "quick"
icon        = "builtin:moon"
color       = "#EB459E"
description = "Tape le message puis Entrée"
type        = "macro"
steps       = [ { type = "text", text = "Bonne nuit tout le monde 🌙" }, { type = "wait", ms = 80 }, { type = "hotkey", keys = "enter" } ]

# --- Pages prêtes à l'emploi ------------------------------------------

[[page]]
id   = "main"
name = "Discord"
keys = [
  { key = 1,  action = "mute" },
  { key = 2,  action = "deafen" },
  { key = 3,  action = "answer" },
  { key = 4,  action = "decline" },
  { key = 5,  action = "quick_switcher" },
  { key = 6,  action = "server_prev" },
  { key = 7,  action = "channel_prev" },
  { key = 8,  action = "unread_next" },
  { key = 9,  action = "mentions" },
  { key = 10, action = "emoji" },
  { key = 11, action = "server_next" },
  { key = 12, action = "channel_next" },
  { key = 13, action = "upload" },
  { key = 14, action = "gif" },
  { key = 15, open = "quick", label = "Messages…" },
]

[[page]]
id          = "quick"
name        = "Discord — Messages rapides"
folder      = true
close_after = true
keys = [
  { key = 1, back = true },
  { key = 2, action = "msg_gg" },
  { key = 3, action = "msg_coming" },
  { key = 4, action = "msg_afk" },
  { key = 5, action = "msg_thanks" },
  { key = 6, action = "msg_night" },
  { key = 11, action = "pins" },
  { key = 12, action = "members" },
  { key = 13, action = "search" },
  { key = 14, action = "server_read" },
  { key = 15, action = "channel_read" },
]
