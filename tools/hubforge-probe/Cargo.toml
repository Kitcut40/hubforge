[package]
name = "hubforge-probe"
version = "0.4.0"
description = "Outil de test HubForge : détecte les modules MasterHUB et valide le protocole USB"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
