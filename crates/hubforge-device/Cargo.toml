[package]
name = "hubforge-device"
version = "0.1.0"
description = "HubForge : communication USB (HID) avec les modules du Cooler Master MasterHUB"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hidapi = { version = "2.6", default-features = false }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
