# Vérification continue : à chaque envoi de code et à chaque proposition de
# modification, GitHub compile HubForge et lance les tests (Windows et Linux).

name: Vérification

on:
  push:
    branches: ["main"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques Linux (interface et USB)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test -p hubforge-device -p hubforge
